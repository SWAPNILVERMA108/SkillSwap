{% extends "base.html" %}
{% block title %}Login | SkillSwap{% endblock %}
{% block content %}
<h1>Login</h1>
<form method="post" class="form-card">
  {% csrf_token %}{{ form.as_p }}
  <button type="submit">Login</button>
</form>
<p class="muted">New here? <a href="{% url 'accounts:register' %}">Create an account</a>.</p>
{% endblock %}
